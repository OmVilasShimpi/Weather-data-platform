name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weather
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weather"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/weather_dbt
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: weather
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install dbt-postgres requests psycopg2-binary python-dotenv

      - name: Create bronze schema and raw table
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(
              host=os.environ["PGHOST"],
              port=os.environ["PGPORT"],
              dbname=os.environ["PGDATABASE"],
              user=os.environ["PGUSER"],
              password=os.environ["PGPASSWORD"],
          )
          conn.autocommit = True

          with conn.cursor() as cur:
              cur.execute("""
                  create schema if not exists bronze;
                  create table if not exists bronze.weather_hourly_raw (
                      ingestion_id text primary key,
                      ingested_at timestamptz not null,
                      city text not null,
                      lat double precision not null,
                      lon double precision not null,
                      payload jsonb not null
                  );
              """)

          conn.close()
          PY

      - name: Run ingestion
        run: python ingestion/fetch_weather.py

      - name: Create dbt profile
        run: |
          cat > weather_dbt/profiles.yml <<'EOF'
          weather_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: 127.0.0.1
                user: postgres
                password: postgres
                port: 5432
                dbname: weather
                schema: public
                threads: 1
          EOF

      - name: Run dbt debug
        working-directory: weather_dbt
        run: dbt debug

      - name: Run dbt models
        working-directory: weather_dbt
        run: dbt run

      - name: Run dbt tests
        working-directory: weather_dbt
        run: dbt test